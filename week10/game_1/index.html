<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Guessing game!</h1>
        <form id="guessing-game">
            <input type="number" name="number" id="number" placeholder="Guess a number">
            <input type="submit" value="Submit">
            <span id="success" style="display: none;">You guessed the number correctly!</span>
            <span id="failure" style="display: none;">You guessed the number wrong!</span>
        </form>
    </div>
    
</body>
<script>
    document.getElementById('guessing-game').onsubmit = (e) =>{
        e.preventDefault();
        document.getElementById('success').style.display = 'none';
        document.getElementById('failure').style.display = 'none';
        let number = document.getElementById('number').value;
        let randomNumber = Math.floor(Math.random() * 10) + 1;
        if(number == randomNumber){
            document.getElementById('success').style.display = 'block';
            
        }else{
            document.getElementById('failure').style.display = 'block';
        }
    }
</script>
</html>
