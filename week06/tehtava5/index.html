<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link href="style.scss" rel="stylesheet"> -->
    <!-- <link href="style.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

    </script> 
</head>
<body>
    <div class="container mt-5">
        <p>
            Hover over these words to see tooltips:  
            <span data-bs-toggle="tooltip" title="Bootstrap is a popular CSS framework." class="text-primary">Bootstrap</span>,  
            <span data-bs-toggle="tooltip" title="A tooltip provides extra information." class="text-success">Tooltip</span>,  
            and  
            <span data-bs-toggle="tooltip" title="Hover effects can be useful for UI." class="text-danger">Hover Effects</span>.
        </p>
        <p>
            <a href="#" data-bs-toggle="tooltip" title="Linkki" class="text-primary">Link</a>
        </p>
    </div>
    
    <!-- Bootstrap JS for Tooltips -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize tooltips
        document.addEventListener("DOMContentLoaded", function () {
            let tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            tooltipTriggerList.forEach(function (tooltipTriggerEl) {
                new bootstrap.Tooltip(tooltipTriggerEl);
            });
        });
    </script>
    
</body>
</html>
