<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Station Page</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./scripts.js" defer></script>
</head>
<body>
    <header>
        <h1>Weather Station</h1>
        <p id="loading">Loading...</p>
    </header>
    <div id="weather-station">
        <div id="temperature-container">
            <p id="time"></p>
            <p id="date"></p>
            <h2 id="city"></h2>
            <h1 id="temperature"></h1>
            <div id="temperature-details">
                <h3 id="feels-like"></h3>
                <h3 id="dew-point"></h3>
            </div>
        </div>
        <div id="weather-description">
            <p id="weather-text"></p>
            <img id="weather-icon" src="" alt="Weather Icon">
        </div>
        <div id="weather-details">
            <p id="pressure"></p>
            <p id="humidity"></p>
            <p id="wind-speed"></p>
            <p id="wind-direction"></p>
        </div>

    </div>
    <footer>
        <p>&copy; 2025 Weather Station by Mitja Savijärvi</p>
        <p>Powered by <a href="https://www.weatherapi.com/" target="_blank">WeatherAPI.com</a></p>
    </footer>
    
</body>
</html>
